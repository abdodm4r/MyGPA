
name: Build MyGPA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip MyGPA_Android_Project.zip
          cd MyGPA_Android
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: MyGPA_Android
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MyGPA-debug-apk
          path: MyGPA_Android/app/build/outputs/apk/debug/app-debug.apk
